<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختيار الملابس</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(135deg,#fceaf4,#f1eafa,#fff7ee);color:#72447d;min-height:100vh;text-align:center}.page{max-width:1100px;margin:24px auto;padding:22px}.heading{background:#fffaf3;border:2px solid #dfb6d4;border-radius:22px;max-width:680px;margin:20px auto;padding:20px;box-shadow:0 6px #ead8ed}.heading:before{content:'🎀';display:block;font-size:30px}.heading h1{margin:4px;font-size:clamp(26px,4vw,40px)}.frame{background:#fffafd;border:2px solid #e7c5df;border-radius:20px;padding:12px;margin:20px auto;max-width:1000px}video{width:100%;aspect-ratio:16/9;background:#28202b;border-radius:12px}button{background:#fff8fa;border:1px solid #dbb7da;border-radius:14px;padding:13px 18px;margin:4px;color:#72447d;font-size:16px;cursor:pointer}button:hover{background:#f3e3f3}.note{font-size:14px;color:#917699}#home{display:none}#home img{max-width:100%;border-radius:16px}</style></head><body><section id="home" class="page" style="display:block"><h1>اختيار الملابس</h1><img src="assets/home.png" alt="الواجهة الرئيسية المعتمدة"><p><button onclick="view('rules')">القوانين الصفية</button></p></section><section id="rules" class="page" style="display:none"><div class="heading"><h1>القوانين الصفية</h1><p>المهارات الحياتية والأسرية | الصف السادس الابتدائي</p></div><div class="frame"><video id="video" controls playsinline preload="metadata" src="assets/class-rules.mp4"></video></div><nav><button onclick="view('home')">الرئيسية</button><button onclick="view('home')">السابق</button><button onclick="view('index')">الفهرس</button><button onclick="view('objectives')">التالي</button><button onclick="restart()">إعادة الفيديو</button></nav><p class="note">النسخة التجريبية: ملفات الصورة والفيديو قيد الرفع</p></section><section id="index" class="page" style="display:none"><div class="heading"><h1>فهرس الدرس</h1></div><p>قيد الإعداد بعد اعتماد شاشة القوانين</p><button onclick="view('rules')">القوانين الصفية</button></section><section id="objectives" class="page" style="display:none"><div class="heading"><h1>أهداف الدرس</h1></div><p>قيد الإعداد</p><button onclick="view('rules')">السابق</button></section><script>function view(id){document.getElementById('video').pause();for(const x of ['home','rules','index','objectives'])document.getElementById(x).style.display=x===id?'block':'none'}function restart(){const v=document.getElementById('video');v.currentTime=0;v.play().catch(()=>{})}</script></body></html>
